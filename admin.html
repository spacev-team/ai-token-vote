<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5FC">
<title>관리자 · AI 토큰 투표</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>

<main class="shell">
  <div class="hero">
    <div class="badge-row"><span class="event-badge"><span class="dot"></span>진행자용 페이지</span></div>
    <div class="hero-token" id="hero-token" aria-hidden="true"></div>
    <h1 class="headline">AI 토큰 투표<br><span class="accent">진행자 대시보드</span></h1>
  </div>

  <div class="section-label">진행 순서</div>
  <div class="host-card">
    <ol style="margin:0; padding-left:20px; font-size:14px; line-height:1.9; color:var(--ink-mid); font-weight:550">
      <li>발표가 모두 끝나면 <b>투표 사이트 QR</b>을 화면에 띄워 공유합니다.</li>
      <li>참석자가 각자 휴대폰으로 한 명에게 토큰을 보냅니다.</li>
      <li>투표가 끝나면 아래 <b>결과 보기</b>를 큰 화면에 띄웁니다.</li>
      <li>“결과 보기” 버튼을 누르고 함께 우승자를 확인합니다.</li>
    </ol>
  </div>

  <div class="section-label">반별 관리</div>
  <div id="host-cards"></div>

  <p style="margin:6px 2px 0; font-size:12px; line-height:1.65; color:var(--ink-soft)">
    ⚠️ 초기화해도 이미 투표한 <b>기기의 “투표 완료” 화면</b>은 남아요. 테스트 참여자에게는
    주소 뒤에 <code>&amp;reset=1</code> 을 붙인 투표 링크를 한 번 열게 하면 다시 투표할 수 있습니다.
  </p>

  <div class="section-label">확인해주세요</div>
  <div class="notice" id="mode-notice"></div>
</main>

<div class="mode-pill" id="mode-pill" hidden></div>

<script src="assets/config.js"></script>
<script src="assets/store.js"></script>
<script src="assets/characters.js"></script>
<script>
(() => {
  document.getElementById('hero-token').innerHTML = Characters.tokenSVG();

  const order = ['practice', 'theory'];
  document.getElementById('host-cards').innerHTML = order.map((key) => {
    const ev = EVENTS[key];
    return `
    <div class="host-card">
      <h2><span style="width:34px;display:inline-block">${Characters.robotSVG({ hue: ev.presenters[0].hue })}</span>${ev.label}</h2>
      <p class="host-date">${ev.dateText} · 발표자 ${ev.presenters.length}명</p>
      <div class="host-links">
        <a class="host-link" href="result.html?class=${key}">
          <span>결과 보기 <span class="tag">행사날 큰 화면에</span></span><span class="arrow">→</span>
        </a>
        <button class="host-link reset-btn" data-target="${key}" type="button">
          <span>데이터 초기화 <span class="tag">이 반 표 전부 삭제</span></span><span class="arrow">🗑</span>
        </button>
      </div>
      <p class="reset-result" id="reset-result-${key}" style="margin:12px 0 0; font-size:13px; font-weight:700; display:none"></p>
    </div>`;
  }).join('');

  /* ---------------- 데이터 초기화 ---------------- */
  const LABELS = { practice: '실습반', theory: '이론반' };

  document.querySelectorAll('.reset-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const target = btn.dataset.target;
      const resultEl = document.getElementById('reset-result-' + target);

      if (!REMOTE_ENDPOINT) {
        showResult(resultEl, '데모 모드에서는 서버에 지울 데이터가 없어요. 이 기기 기록은 vote.html?reset=1 로 지웁니다.', false);
        return;
      }
      const key = window.prompt(`[${LABELS[target]} 초기화] 관리자 비밀번호를 입력하세요`);
      if (!key) return;
      if (!window.confirm(`정말 ${LABELS[target]} 표를 모두 삭제할까요? 되돌릴 수 없어요.`)) return;

      showResult(resultEl, '지우는 중…', true);
      try {
        /* 구글이 가끔 일시적 서버 오류를 던지므로 최대 3번까지 자동 재시도 */
        let res;
        for (let attempt = 1; attempt <= 3; attempt++) {
          const r = await fetch(REMOTE_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'reset', eventId: EVENTS[target].id, adminKey: key }),
            redirect: 'follow',
          });
          res = await r.json();
          /* 성공했거나, 재시도해도 소용없는 오류(비밀번호 틀림 등)면 멈춤 */
          if (res.ok || res.error === 'BAD_KEY' || res.error === 'UNKNOWN_ACTION') break;
          showResult(resultEl, `일시 오류, 다시 시도 중… (${attempt}/3)`, true);
          await new Promise((w) => setTimeout(w, 1500));
        }
        if (res.ok) {
          /* 이 기기의 투표 기록도 함께 지워서 바로 재테스트 가능하게 */
          Object.keys(localStorage)
            .filter((k) => (k.startsWith('aitoken:voted:') || k.startsWith('aitoken:tally:')) && k.includes(EVENTS[target].id))
            .forEach((k) => localStorage.removeItem(k));
          showResult(resultEl, `✅ ${LABELS[target]} 표 ${res.deleted}개 삭제 완료 (이 기기 기록도 초기화됨)`, true);
        } else if (res.error === 'BAD_KEY') {
          showResult(resultEl, '❌ 비밀번호가 틀렸어요.', false);
        } else if (res.error === 'UNKNOWN_ACTION') {
          showResult(resultEl, '❌ 서버에 초기화 기능이 없어요. Apps Script 코드를 최신 Code.gs 로 교체하고 새 버전으로 배포해주세요.', false);
        } else {
          showResult(resultEl, `❌ 실패: ${res.error}`, false);
        }
      } catch (e) {
        showResult(resultEl, '❌ 서버에 연결하지 못했어요. 잠시 뒤 다시 시도해주세요.', false);
      }
    });
  });

  function showResult(el, msg, ok) {
    el.style.display = 'block';
    el.style.color = ok ? '#1E9678' : '#D14343';
    el.textContent = msg;
  }

  const notice = document.getElementById('mode-notice');
  if (Store.mode === 'demo') {
    notice.innerHTML = `<span>⚠️</span><div>
      지금은 <b>데모 모드</b>입니다. 투표가 접속한 기기 안에만 저장되므로 여러 사람의 표가 합산되지 않습니다.<br>
      실제 행사에서 쓰려면 <code>assets/config.js</code> 의 <code>REMOTE_ENDPOINT</code> 에
      Apps Script 주소를 넣어주세요. 방법은 <code>README.md</code> 에 있습니다.</div>`;
    document.getElementById('mode-pill').hidden = false;
    document.getElementById('mode-pill').textContent = '데모 모드 · 이 기기에만 집계됨';
  } else {
    notice.innerHTML = `<span>✅</span><div>
      <b>실제 집계 모드</b>입니다. 표가 구글 시트에 모입니다.<br>
      발표 제목은 <code>assets/config.js</code> 의 <code>title</code> 에 채워주세요.</div>`;
  }
})();
</script>
</body>
</html>
